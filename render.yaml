services:
  - type: web
    name: mr-book-reviews
    runtime: python
    buildCommand: |
      pip install -r requirements.txt
      gunzip -k mr_books.db.gz || true
    startCommand: gunicorn web_ui:app --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
